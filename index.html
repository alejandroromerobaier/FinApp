<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FinApp - Bóvedas Compartidas</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#000666" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinApp" />
    <meta name="description" content="Gestión financiera personal y bóvedas compartidas en tiempo real" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Self-healing for stale PWA cache / missing chunks
      window.addEventListener('error', function(e) {
        var target = e.target || e.srcElement;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var key = 'finapp_chunk_load_failed_' + (target.src || target.href || '');
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    for (var j = 0; j < names.length; j++) { caches.delete(names[j]); }
                    window.location.reload(true);
                  });
                } else {
                  window.location.reload(true);
                }
              });
            } else {
              window.location.reload(true);
            }
          }
        }
      }, true);

      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              // Ensure we check for updates immediately
              reg.update().catch(() => {});
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
